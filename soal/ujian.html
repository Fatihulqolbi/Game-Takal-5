<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e2a4a">
<title>Latihan - Soal TKA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="css/soal.css">
</head>
<body>
<header class="bar">
  <button class="btn kecil" id="keluar">✕ Keluar</button>
  <div class="nama" id="nama"></div>
  <div class="timer" id="timer" role="timer" aria-label="Waktu berjalan">00:00</div>
</header>

<main class="wrap" id="ujian">
  <div class="ujian">
    <section class="kartu" id="soal" aria-live="polite"></section>
    <aside class="samping kartu" id="samping">
      <h3>Nomor soal</h3>
      <button class="btn kecil tombol-nomor" id="tglNomor">Buka daftar nomor</button>
      <div class="grid" id="grid"></div>
      <div class="legenda"><span><i></i>kosong</span><span><i class="t"></i>terisi</span><span><i class="r"></i>ragu-ragu</span></div>
      <button class="btn utama" id="selesai">Selesai</button>
    </aside>
  </div>
</main>

<main class="wrap" id="hasil" hidden>
  <section class="kartu">
    <div class="skor" id="skor"></div>
    <div class="aksi" style="justify-content:center">
      <a class="btn utama" href="index.html">Kembali ke daftar paket</a>
      <button class="btn" id="ulang">Kerjakan lagi</button>
    </div>
  </section>
  <section class="kartu" style="margin-top:18px">
    <h2 style="font-family:var(--display);margin:0">Pembahasan</h2>
    <div class="bahas" id="bahas"></div>
  </section>
</main>

<dialog id="dlgKeluar">
  <h3>Keluar dari latihan?</h3><p>Jawabanmu belum dikumpulkan dan akan hilang.</p>
  <div class="aksi"><button class="btn" id="kBatal">Lanjut mengerjakan</button><a class="btn merah" href="index.html">Keluar</a></div>
</dialog>
<dialog id="dlgSelesai">
  <h3>Kumpulkan jawaban?</h3><p id="selesaiInfo"></p>
  <div class="aksi"><button class="btn" id="sBatal">Periksa lagi</button><button class="btn utama" id="sOk">Kumpulkan</button></div>
</dialog>

<script src="js/soal-core.js"></script>
<script src="js/ui.js"></script>
<script src="js/ujian.js"></script>
</body>
</html>
